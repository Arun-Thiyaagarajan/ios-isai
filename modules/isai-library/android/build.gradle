plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.isai.library'
version = '0.1.0'

android {
  namespace "app.isai.library"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Extracts dominant colors from album artwork for tinted backgrounds.
  implementation "androidx.palette:palette-ktx:1.0.0"
}
